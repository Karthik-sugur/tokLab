# Real-data MVP experiment on the 28-repo corpus.
# Paths are relative to repo root.
name: mvp_py
seed: 0

model:
  model_name: Qwen/Qwen2.5-Coder-0.5B
  tokenizer_name: Qwen/Qwen2.5-Coder-0.5B
  tie_word_embeddings: true
  d_model: 896
  num_hidden_layers: 24
  num_key_value_heads: 2
  head_dim: 64

data:
  # Every stage (fidelity, intrinsic, context, mining, factorial, systems,
  # drift) reads this corpus. The run fails if synth_manifest.parquet is
  # missing or was built from a different manifest.
  corpus:
    kind: synthetic
    dir: data/synthetic
    manifest: data/processed/manifest.parquet
  eval_split: test
  # test = new codebase (held-out repos); test_inorg = new files in known
  # (adapt) codebases. See docs/decisions/004-inorg-eval.md.
  eval_splits: [test, test_inorg]
  adapt_split: adapt
  # K* = argmin val tokens/KB for C3. See docs/decisions/005-k-selection.md.
  k_selection_split: val

vocab:
  # Capped at the number of positive-gain candidates.
  k_values: [0, 256, 1024, 4096, 16384]
  min_freq: 1
  min_repos: 1

intrinsic:
  conditions: [C2, C3, C4, C5]
  context_budgets: [64, 128, 256, 512]
  n_boot: 50

# Separate pipeline step at K*: `toklab run systems --run <hash>`
# (skip with SKIP_SYSTEMS=1 in scripts/run_real_pipeline.sh).
systems:
  enabled: true
  conditions: [C2, C3, C4, C5]
  seq_lens: [512, 1024, 2048]
  n_warmup: 2
  n_repeats: 10
  device: cpu
  dtype: float32
  input_split: test

stages:
  fidelity: true
  intrinsic: true
  factorial: true
  context: true
  vocab_cost: true
  report: true

hypotheses_path: configs/hypotheses.yaml
runs_root: runs
