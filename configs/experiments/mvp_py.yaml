# MVP Python experiment (fixture-scale). Paths are relative to repo root.
name: mvp_py
seed: 0

model:
  model_name: Qwen/Qwen2.5-Coder-0.5B
  tokenizer_name: Qwen/Qwen2.5-Coder-0.5B
  tie_word_embeddings: true
  d_model: 896
  num_hidden_layers: 24
  num_key_value_heads: 2
  head_dim: 64

data:
  repos_dir: tests/fixtures/mvp/repos
  manifest_path: tests/fixtures/mvp/manifest/manifest.parquet
  eval_split: test
  adapt_split: adapt

vocab:
  k_values: [0, 8]
  min_freq: 1
  min_repos: 1

intrinsic:
  conditions: [C2, C3, C4, C5]
  context_budgets: [64, 128, 256, 512]
  n_boot: 50

systems:
  enabled: false
  conditions: [C2, C4]
  seq_lens: [32, 64]
  n_warmup: 5
  n_repeats: 30
  dtype: float32

stages:
  fidelity: true
  intrinsic: true
  factorial: true
  context: true
  vocab_cost: true
  systems: false
  report: true

hypotheses_path: configs/hypotheses.yaml
runs_root: runs
